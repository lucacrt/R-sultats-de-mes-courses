<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes courses</title>
<style>
:root{--bg:#f6f5f1;--cd:#fff;--tx:#1b1f23;--mu:#6b7280;--ac:#0f6e56;--bd:#e3e1da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--cd:#1e2327;--tx:#eceff1;--mu:#9aa4ad;--ac:#3ecf9f;--bd:#2c343a}}
:root[data-theme="dark"]{--bg:#14171a;--cd:#1e2327;--tx:#eceff1;--mu:#9aa4ad;--ac:#3ecf9f;--bd:#2c343a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 14px}h2{font-size:18px;margin:24px 0 8px}
form,.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px}
.card{margin-bottom:10px}
input,select,textarea,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;box-sizing:border-box;margin:0 0 8px}
textarea{min-height:56px}
.r{display:flex;gap:8px}.r>*{min-width:0}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}
.sg{display:flex;align-items:center;gap:8px}.sg label{flex:0 0 90px;font-size:14px}.sg.t label{color:var(--mu);font-style:italic}.sg input{margin:0 0 6px}.sg{flex-wrap:wrap}.sg input.tm{flex:1 1 0;width:auto;min-width:0}.sg input.u{flex:1 0 100%;width:100%;font-size:14px}.sg input.d{flex:0 0 76px;width:76px}.sg .dd{flex:0 0 76px}
.tot{margin:6px 0 10px;font-size:18px}
.mu{color:var(--mu);font-size:14px}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.ch span{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:3px 10px;font-size:13px}
.big{font-size:22px;font-weight:700;color:var(--ac)}
.card a{color:var(--ac);margin-right:12px;font-size:14px}
.card .b{display:flex;gap:8px;margin-top:8px}.card .b button{width:auto;padding:6px 12px;font-size:13px}
</style></head><body><main>
<h1>🏁 Mes courses</h1>
<form id="fm">
<input id="nm" placeholder="Nom de la course" required>
<div class="r"><input id="dt" type="date" required><select id="sp"></select></div>
<div class="r"><input id="ds" type="number" step="any" min="0" placeholder="Distance (km)"><input id="pl" placeholder="Lieu"></div>
<input id="ur" type="url" placeholder="Site officiel (https://…)">
<input id="rt" type="url" placeholder="Lien du tracé (carte, GPX…)">
<div id="sg"></div>
<div class="tot">Total : <b id="tot">–</b></div>
<textarea id="nt" placeholder="Notes (météo, sensations…)"></textarea>
<div class="r"><button>Enregistrer</button><button type="button" id="cn" class="g" hidden>Annuler</button></div>
</form>

<h2>Historique</h2>
<div class="r"><input id="q" placeholder="Rechercher…"><select id="fs"></select></div>
<div id="ls"></div>

<details><summary class="mu">Sauvegarde / transfert entre appareils</summary>
<p class="mu">Les données restent dans ce navigateur. Exporte pour les copier, importe sur un autre appareil.</p>
<textarea id="io" placeholder="Données JSON"></textarea>
<div class="r"><button type="button" id="ex" class="g">Exporter</button><button type="button" id="im" class="g">Importer</button></div>
</details>
</main>
<script>
const $=i=>document.getElementById(i);
const SP={"Triathlon":["Natation","T1","Vélo","T2","Course"],"Duathlon":["Course 1","T1","Vélo","T2","Course 2"],"Aquathlon":["Natation","T1","Course"],"Course à pied":["Temps"],"Trail":["Temps"],"Vélo":["Temps"],"Natation":["Temps"],"Voile":["Temps"],"Autre":["Temps"]};
const K="mes-courses-v1";let races=[],ed=null;
try{races=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(races))}catch(e){}};
const p=s=>{if(!s||!s.trim())return 0;const a=s.trim().replace(/[hH]/,":").split(":").map(Number);return a.some(isNaN)?0:a.reduce((t,v)=>t*60+v,0)};
const fm=t=>{const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=Math.round(t%60);return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ok=u=>/^https?:\/\//i.test(u||"");
$("sp").innerHTML=Object.keys(SP).map(k=>`<option>${k}</option>`).join("");
$("fs").innerHTML='<option value="">Tous les sports</option>'+Object.keys(SP).map(k=>`<option>${k}</option>`).join("");

const MS=()=>SP[$("sp").value].length>1;
function seg(v){
  $("ds").hidden=MS();$("rt").hidden=MS();
  $("sg").innerHTML=SP[$("sp").value].map((l,i)=>{const tr=/^T\d$/.test(l),x=(v&&v[i])||{},sw=/Natation/.test(l);
  return `<div class="sg${tr?" t":""}"><label>${l}</label>${tr?'<span class="dd"></span>':`<input class="d" type="number" step="any" min="0" inputmode="decimal" placeholder="${sw?"m":"km"}" value="${x.d?(sw?Math.round(x.d*1000):x.d):""}">`}<input class="tm" data-l="${l}" placeholder="h:mm:ss" value="${x.t?fm(x.t):""}">${tr?"":`<input class="u" type="url" placeholder="Lien du tracé (Strava…)" value="${esc(x.u||"")}">`}</div>`}).join("");
  tot();
}
function tot(){const t=[...document.querySelectorAll("#sg .tm")].reduce((s,i)=>s+p(i.value),0);$("tot").textContent=t?fm(t):"–"}
$("sp").onchange=()=>seg();$("sg").oninput=tot;

function reset(){ed=null;$("fm").reset();$("cn").hidden=true;seg()}
$("cn").onclick=reset;
$("fm").onsubmit=e=>{e.preventDefault();
  const s=[...document.querySelectorAll("#sg .sg")].map(w=>{const l=w.querySelector(".tm").dataset.l,v=parseFloat((w.querySelector(".d")||{}).value)||0;return{l,t:p(w.querySelector(".tm").value),d:/Natation/.test(l)?v/1000:v,u:((w.querySelector(".u")||{}).value||"").trim()}});
  const r={id:ed||Date.now().toString(36),name:$("nm").value.trim(),date:$("dt").value,sport:$("sp").value,dist:MS()?+s.reduce((a,x)=>a+x.d,0).toFixed(3):parseFloat($("ds").value)||0,place:$("pl").value.trim(),url:$("ur").value.trim(),route:MS()?"":$("rt").value.trim(),notes:$("nt").value.trim(),seg:s};
  races=races.filter(x=>x.id!==r.id);races.push(r);save();reset();draw();
};

function pace(r,t){
  if(!r.dist||!t)return"";
  if(r.sport==="Course à pied"||r.sport==="Trail")return fm(t/r.dist)+" /km";
  if(r.sport==="Vélo")return (r.dist/(t/3600)).toFixed(1)+" km/h";
  if(r.sport==="Natation")return fm(t/(r.dist*10))+" /100 m";
  return"";
}
const sd=(l,d)=>/Natation/.test(l)?Math.round(d*1000)+" m":+d.toFixed(3)+" km";
const sp=(l,d,t)=>{if(!d||!t)return"";if(/Natation/.test(l))return fm(t/(d*10))+"/100 m";if(/Vélo/.test(l))return (d/(t/3600)).toFixed(1)+" km/h";if(/Course/.test(l))return fm(t/d)+"/km";return""};
function card(r){
  const t=r.seg.reduce((s,x)=>s+x.t,0),d=new Date(r.date+"T00:00").toLocaleDateString("fr-CH",{day:"numeric",month:"short",year:"numeric"});
  const multi=r.seg.length>1;
  return `<div class="card"><b>${esc(r.name)}</b>
<div class="mu">${d} · ${esc(r.sport)}${r.dist?" · "+r.dist+" km":""}${r.place?" · "+esc(r.place):""}</div>
${t?`<div class="big">${fm(t)}</div><div class="mu">${pace(r,t)}</div>`:'<div class="mu">Temps non saisi</div>'}
${multi?`<div class="ch">${r.seg.filter(x=>x.t||x.d||x.u).map(x=>`<span>${[esc(x.l),x.d?sd(x.l,x.d):"",x.t?fm(x.t):"",sp(x.l,x.d,x.t)].filter(Boolean).join(" · ")}${ok(x.u)?` · <a href="${esc(x.u)}" target="_blank" rel="noopener">Tracé</a>`:""}</span>`).join("")}</div>`:""}
${r.notes?`<div class="mu">${esc(r.notes)}</div>`:""}
<div style="margin-top:6px">${ok(r.url)?`<a href="${esc(r.url)}" target="_blank" rel="noopener">Site officiel</a>`:""}${ok(r.route)?`<a href="${esc(r.route)}" target="_blank" rel="noopener">Tracé</a>`:""}</div>
<div class="b"><button class="g" data-a="e" data-id="${r.id}">Modifier</button><button class="g" data-a="d" data-id="${r.id}">Supprimer</button></div></div>`;
}
function draw(){
  const q=$("q").value.toLowerCase(),s=$("fs").value;
  const L=races.filter(r=>(!s||r.sport===s)&&(r.name+" "+r.place+" "+r.notes).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));
  $("ls").innerHTML=L.length?L.map(card).join(""):'<p class="mu">Aucune course pour l’instant.</p>';
}
$("q").oninput=$("fs").onchange=draw;
$("ls").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  const r=races.find(x=>x.id===b.dataset.id);if(!r)return;
  if(b.dataset.a==="d"){
    if(!b.dataset.arm){b.dataset.arm=1;b.textContent="Confirmer ?";return}
    races=races.filter(x=>x.id!==r.id);save();draw();return;
  }
  ed=r.id;$("nm").value=r.name;$("dt").value=r.date;$("sp").value=r.sport;$("ds").value=r.dist||"";$("pl").value=r.place;$("ur").value=r.url;$("rt").value=r.route;$("nt").value=r.notes;
  seg(r.seg);$("cn").hidden=false;window.scrollTo({top:0,behavior:"smooth"});
};
$("ex").onclick=()=>{$("io").value=JSON.stringify(races)};
$("im").onclick=()=>{try{const a=JSON.parse($("io").value);if(!Array.isArray(a))return;const m=new Map(races.map(r=>[r.id,r]));a.forEach(r=>{if(r&&r.id&&r.seg)m.set(r.id,r)});races=[...m.values()];save();draw()}catch(e){}};
seg();draw();
</script></body></html>
